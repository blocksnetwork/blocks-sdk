# Python agent network-isolation harness. See Dockerfile for rationale.
# Mirrors examples/other/agent-docker/docker-compose.yml; differences
# noted inline.
#
# Usage (from this directory):
#   docker compose build
#   docker compose up                  # echo example
#   AGENT_DIR=../../../blocks-sdk/examples/python/echo-stream docker compose up
#   ./blip.sh 30                       # simulate 30s outage
#
# Backend port defaults to 3011 (this worktree's afui_mvp_backend .env).
# Override by exporting BACKEND_PORT=3001 (or any) before `up` to point
# at a different backend.

services:
  agent:
    build:
      context: ../../..
      dockerfile: examples/other/agent-docker-python/Dockerfile
    container_name: blocks-agent-py-test
    working_dir: /agent
    volumes:
      - ${AGENT_DIR:-../../../blocks-sdk/examples/python/echo}:/agent
      # Match host clock so log-prefix.mjs timestamps line up with the
      # backend's pino-pretty output for cross-terminal correlation.
      - /etc/localtime:/etc/localtime:ro
    environment:
      BLOCKS_CDM_URL: http://host.docker.internal:${BACKEND_PORT:-3011}/api/v1/cdm
      # Entrypoint socat forwards these from the container's loopback
      # to host.docker.internal, so the CDM-provided api.baseUrl
      # ("http://localhost:{BACKEND_PORT}") resolves from inside the
      # container without rewriting the URL.
      HOST_BACKEND: host.docker.internal:${BACKEND_PORT:-3011}
      LOCAL_BACKEND_PORT: ${BACKEND_PORT:-3011}
      # Required for agent registration. Set in your shell or .env
      # next to this compose file. Obtain via `blocks login`.
      BLOCKS_API_KEY: ${BLOCKS_API_KEY:?Set BLOCKS_API_KEY in your environment or .env}
      # Force Node's clock (used by log-prefix.mjs) to match the host TZ
      # so stamps line up with the backend's pino-pretty output.
      # Override per-shell or via .env (e.g. TZ=Europe/Warsaw).
      # macOS: the /etc/localtime mount is unreliable on Docker
      # Desktop, so TZ is the authoritative source here.
      TZ: ${TZ:-UTC}
      # Phase 1 connectivity diagnostics (BLOCKS-129) emit at debug
      # level. Override with LOG_LEVEL=info for a quieter console.
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Force unbuffered Python stdout/stderr. The entrypoint pipes the
      # agent through log-prefix.mjs, which makes stdout a pipe — Python
      # then switches to block-buffered mode and holds output until the
      # buffer fills (~4-8 KB) or the process exits. Without this flag
      # the agent looks silent during a normal run (only visible on
      # crash, when the buffer flushes on exit), defeating the harness.
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-py-net
    tty: true
    stdin_open: true
    # `blocks-run` is the Python SDK's console_script entry registered
    # by `pip install -e /sdk` inside the image. The entrypoint cd's
    # into /agent (bind-mounted) before exec'ing this command, so the
    # agent's handler module resolves relative to the project root.
    command: blocks-run

networks:
  agent-py-net:
    name: blocks-agent-py-net
    driver: bridge
