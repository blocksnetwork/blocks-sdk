[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetry-provider-py"
version = "1.0.0"
description = "Stream symmetry test provider (Python). Round-trips bytes + events streams in both directions and returns SHA-256 digests as a final artifact for cross-side hash verification."
requires-python = ">=3.10"
dependencies = [
    "blocks-network",
]

[tool.setuptools]
py-modules = ["handler"]
