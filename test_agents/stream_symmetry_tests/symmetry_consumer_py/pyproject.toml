[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetry-consumer-py"
version = "1.0.0"
description = "Stream symmetry test consumer driver (Python). Sends a pipe task to symmetry_provider_py, opens all four streams, runs the same shared helpers as the provider, and prints PASS/FAIL based on hash equality of the four bidirectional payloads."
requires-python = ">=3.10"
dependencies = [
    "blocks-network",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["main"]
