version: 2

project_name: blocks

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: blocks
    ldflags:
      - -s -w
      - -X github.com/pubnub/blocks-sdk/cli/cmd.Version={{.Version}}
      - -X github.com/pubnub/blocks-sdk/cli/cmd.defaultBackendURL={{ .Env.BLOCKS_BACKEND_URL }}
      - -X github.com/pubnub/blocks-sdk/cli/cmd.defaultCliClientID={{ .Env.BLOCKS_CLI_CLIENT_ID }}
      # BLOCKS_INSTANCE_DOMAIN is optional and MUST never resolve to an empty
      # string: an empty domain would expand `blocks login acme` to
      # `https://acme.`. envOrDefault alone only covers an unset variable — a
      # variable that is set but empty (an undefined CI variable expands to "")
      # still yields "", so the `with`/`else` block rejects that case too.
      - -X github.com/pubnub/blocks-sdk/cli/cmd.defaultInstanceDomain={{ with envOrDefault "BLOCKS_INSTANCE_DOMAIN" "blocks.ai" }}{{ . }}{{ else }}blocks.ai{{ end }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: blocksnetwork
    name: blocks-sdk
  draft: false
  prerelease: auto
  extra_files:
    - glob: install.sh
    - glob: install.ps1
