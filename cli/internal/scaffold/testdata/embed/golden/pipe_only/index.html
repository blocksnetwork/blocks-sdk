<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pipe_only</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  
  <script src="/__blocks_embed_dev.js"></script>
  
  <script>
  (function () {
    var dev = typeof window !== 'undefined' ? window.__BLOCKS_EMBED_DEV__ : null;
    var base = (dev && dev.backendBaseUrl) ? dev.backendBaseUrl : 'https:\/\/blocks.ai';
    var s = document.createElement('script');
    s.src = base + '/embed/auth.0.1.0.min.js';
    s.async = false;
    document.head.appendChild(s);
  })();
  </script>
  <script src="app.js" defer></script>
  <div id="app">
    <div id="auth-bar">
      <button id="sign-in-btn" type="button">Sign in with Blocks</button>
      <button id="sign-out-btn" type="button" hidden>Sign out</button>
      <span id="auth-error"></span>
    </div>
    <section class="agent-section" id="section-pipe_only" hidden>
      <h2>pipe_only</h2>
      <label for="input-pipe_only-request">request — JSON pipe input</label>
      <textarea id="input-pipe_only-request" rows="4">{
  &quot;text&quot;: &quot;hi&quot;
}</textarea>
      <label for="duration-pipe_only">Duration (minutes, 1–43200)</label>
      <input type="number" class="duration" id="duration-pipe_only" min="1" max="43200" value="30" />
      <button id="send-pipe_only" type="button">Send</button>
      <pre class="output" id="output-pipe_only"></pre>
      <label>Stream</label>
      <pre class="stream" id="stream-pipe_only"></pre>
    </section>
  </div>
</body>
</html>
