<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login Failed — Blocks CLI</title>
    <style>
      :root {
        --status: #f87171;
        --status-border: rgba(248, 113, 113, 0.3);
        --status-bg: rgba(248, 113, 113, 0.1);
        --status-shadow: rgba(248, 113, 113, 0.7);
        --status-ring: rgba(248, 113, 113, 0.06);
        --status-glow: rgba(248, 113, 113, 0.1);
      }
      {{.Styles}}
      .error-detail {
        margin-top: 18px;
        padding: 12px 14px;
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.25);
        border-radius: 10px;
        font-size: 0.8rem;
        color: #fca5a5;
        text-align: left;
        word-break: break-word;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        opacity: 0;
        animation: fade-in 420ms ease-out 620ms forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .error-detail {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
